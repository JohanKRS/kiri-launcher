name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the debug and optimized APKs
        run: ./gradlew :core:test :app:assembleDebug :app:assembleOptimized --stacktrace

      # Google Play's build (unsigned here): it must still build, and leave out what Play asks to
      # be declared (see app/src/play/AndroidManifest.xml).
      - name: Build Google Play's bundle and check its permissions
        run: |
          ./gradlew :app:bundlePlay --stacktrace
          manifest="$(unzip -p app/build/outputs/bundle/play/app-play.aab base/manifest/AndroidManifest.xml | tr -d '\000')"
          for name in MANAGE_EXTERNAL_STORAGE QUERY_ALL_PACKAGES READ_MEDIA_IMAGES BIND_ACCESSIBILITY_SERVICE KiriAccessibilityService; do
            if [[ "$manifest" == *"$name"* ]]; then
              echo "Google Play's bundle still has $name." >&2
              exit 1
            fi
          done

      - name: Check that nothing from the personal folder is in the app
        run: |
          if unzip -p app/build/outputs/apk/debug/app-debug.apk 'classes*.dex' | grep -a -q 'kiri/personal'; then
            echo "The app holds code from the personal folder." >&2
            exit 1
          fi

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kiri-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: kiri-optimized-apk
          path: app/build/outputs/apk/optimized/*.apk
          if-no-files-found: error
