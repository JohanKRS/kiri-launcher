org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Kiri's version: the only place it is written (see app/build.gradle.kts and CHANGELOG.md).
kiri.version=0.2.1

# Kiri targets Android 16 (API 36), which Google Play asks of every new app since 2026-08-31. This
# Android Gradle plugin builds it well but was tested only up to API 35, and says so on each build.
android.suppressUnsupportedCompileSdk=36
